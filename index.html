<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>会主动找你的 AI</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#242c37;
    --me:#2d6cdf; --ai:#1e2530; --txt:#e6edf3; --dim:#8b98a9;
    --ok:#3fb950; --warn:#d29922; --err:#f85149;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--txt);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;flex-direction:column}
  header{padding:12px 16px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:10px;background:var(--panel)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.bad{background:var(--err)}
  header h1{font-size:15px;margin:0;font-weight:600;flex:1}
  .btn{background:#232b36;border:1px solid var(--line);color:var(--txt);
       border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
  .btn:hover{background:#2c3540}
  #panel{max-height:0;overflow:hidden;transition:max-height .25s;
         border-bottom:1px solid var(--line);background:#12161c;font-size:12.5px}
  #panel.open{max-height:300px;overflow:auto}
  #panel .wrap{padding:10px 16px}
  .scene{border-left:2px solid var(--warn);padding:4px 0 4px 10px;margin:6px 0;color:var(--dim)}
  .scene b{color:var(--txt);font-weight:600}
  .meta{color:var(--dim);font-size:11.5px;margin-top:2px}
  #log{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:82%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
  .msg.me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:var(--ai);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.wake{align-self:flex-start;background:#2b2418;border:1px solid #4a3c1c;color:#f0d9a0}
  .tag{font-size:10.5px;color:var(--warn);display:block;margin-bottom:4px;letter-spacing:.5px}
  .typing{align-self:flex-start;color:var(--dim);font-size:13px;padding:6px 0}
  #bar{border-top:1px solid var(--line);background:var(--panel);padding:10px 12px;
       padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .quick .btn{font-size:11.5px;padding:4px 9px}
  form{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;background:#0b0e13;border:1px solid var(--line);border-radius:10px;
           color:var(--txt);padding:10px 12px;font:inherit;min-height:42px;max-height:140px;outline:none}
  textarea:focus{border-color:var(--me)}
  #send{background:var(--me);color:#fff;border:0;border-radius:10px;padding:11px 18px;
        cursor:pointer;font:inherit;white-space:nowrap}
  #send:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>会主动找你的 AI</h1>
  <button class="btn" id="toggle">状态</button>
</header>
<div id="panel"><div class="wrap" id="panelBody">加载中…</div></div>
<div id="log"></div>
<div id="bar">
  <div class="quick">
    <button class="btn" data-act="alarm10">10 分钟后找我</button>
    <button class="btn" data-act="repeat30">每 30 分钟</button>
    <button class="btn" data-act="snooze">暂停 1 小时</button>
    <button class="btn" data-act="clear">清除闹钟</button>
    <button class="btn" data-act="endscenes">结束情境</button>
  </div>
  <form id="f">
    <textarea id="in" rows="1" placeholder="说点什么…（比如：我出门了 / 每隔十分钟来找我一次）"></textarea>
    <button id="send" type="submit">发送</button>
  </form>
</div>
<script>
const log=document.getElementById('log'), inp=document.getElementById('in'),
      send=document.getElementById('send'), dot=document.getElementById('dot'),
      panel=document.getElementById('panel'), panelBody=document.getElementById('panelBody');
const typing=document.createElement('div');
typing.className='typing'; typing.textContent='思考中…';
let busy=false;

function add(text,cls,tag){
  const d=document.createElement('div'); d.className='msg '+(cls||'ai');
  if(tag){const t=document.createElement('span'); t.className='tag'; t.textContent=tag; d.appendChild(t);}
  d.appendChild(document.createTextNode(text));
  log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
}
async function post(path,body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body||{})});
  return r.json();
}
function show(text){ panelBody.textContent=text; }

async function sendMsg(){
  const text=inp.value.trim(); if(!text||busy) return;
  busy=true; send.disabled=true; inp.value=''; inp.style.height='auto';
  add(text,'me'); log.appendChild(typing); log.scrollTop=log.scrollHeight;
  try{
    const r=await post('/message',{text});
    typing.remove();
    add(r.reply||'(空回复)','ai');
  }catch(e){ typing.remove(); add('发送失败：'+e,'ai'); }
  busy=false; send.disabled=false; inp.focus(); refresh();
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();sendMsg();});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px';});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
document.getElementById('toggle').addEventListener('click',()=>panel.classList.toggle('open'));

async function tool(action,args){
  const r=await post('/api/tool',{action,args:args||{}});
  const txt=typeof r==='string'?r:JSON.stringify(r);
  add(txt.slice(0,260),'ai','安排结果');
  refresh();
}
document.querySelectorAll('.quick .btn').forEach(b=>{
  b.addEventListener('click',async()=>{
    const act=b.dataset.act;
    if(act==='alarm10'){
      const at=new Date(Date.now()+10*60*1000).toISOString();
      await tool('set_alarm',{at:at,note:'10 分钟后找你'});
    } else if(act==='repeat30'){
      await tool('set_repeat',{cadence_min:30,duration_min:180});
    } else if(act==='snooze'){
      await tool('snooze',{minutes:60});
    } else if(act==='clear'){
      await tool('clear_alarm',{alarm_id:'all'});
    } else if(act==='endscenes'){
      const st=await (await fetch('/api/status')).json();
      const scenes=st.active_scenes||[];
      if(!scenes.length){ add('当前没有活跃情境','ai'); return; }
      for(const s of scenes){ await tool('end_scene',{scene_id:s.id}); }
    }
  });
});

function sceneLine(s){
  const cond=s.wake_condition?(s.wake_condition.summary||'等待条件'):'';
  return '<div class="scene"><b>'+(s.title||s.type)+'</b> · '+s.type+
         '<div class="meta">间隔 '+(s.cadence_min??'-')+' 分钟'+
         (cond?(' · '+cond):'')+
         (s.next_wake_at?(' · 下次 '+s.next_wake_at):'')+'</div></div>';
}
async function refresh(){
  try{
    const r=await (await fetch('/api/status')).json();
    if(r.ok){
      dot.className='dot '+(r.configured?'on':'bad');
      let html='';
      if(!r.configured){
        html+='<div class="scene" style="border-color:#f85149">配置不完整：请编辑 server.py 同目录的 config.json，填 api_base / api_key / main_model，然后重启服务。</div>';
      }
      html+='<div class="meta">模型：'+(r.model||'未配置')+'　中转站：'+(r.api_base||'未配置')+'</div>';
      const a=r.active_scenes||[];
      html+= a.length ? a.map(sceneLine).join('') : '<div class="meta">当前没有活跃情境</div>';
      show(html);
    } else {
      dot.className='dot bad'; show('后端未就绪：'+(r.error||''));
    }
  }catch(e){ dot.className='dot bad'; show('连不上后端：'+e); }
}

async function poll(){
  while(true){
    try{
      const r=await (await fetch('/poll')).json();
      if(r && r.message){ add(r.message,'wake','主动唤醒'); }
    }catch(e){}
    await new Promise(s=>setTimeout(s,1200));
  }
}
refresh(); setInterval(refresh,15000); poll();
</script>
</body>
</html>
